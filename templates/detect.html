{% extends 'base.html' %}{% block title %}Detect | FraudShield AI{% endblock %}{% block content %}<section class="container page"><p class="eyebrow">MANUAL DETECTION</p><h1>Analyze a transaction</h1><p class="text-secondary">Enter the dataset features. Results are an ML-based risk assessment.</p><form id="detectForm" class="row g-3 mt-2"><div class="col-md-6"><label class="form-label">Transaction Time</label><input required min="0" type="number" step="any" class="form-control" name="Time" value="1000"></div><div class="col-md-6"><label class="form-label">Amount</label><input required min="0" type="number" step="any" class="form-control" name="Amount" value="100"></div>{% for i in range(1,29) %}<div class="col-md-3"><label class="form-label">V{{i}}</label><input required type="number" step="any" class="form-control" name="V{{i}}" value="0"></div>{% endfor %}<div class="col-12"><button class="btn btn-primary btn-lg" type="submit">Detect fraud risk</button></div></form><div id="result" class="mt-4"></div></section>{% endblock %}{% block scripts %}<script src="{{url_for('static',filename='js/detection.js')}}"></script>{% endblock %}
